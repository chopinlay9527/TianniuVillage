<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>甜牛村</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>

  <nav id="topbar">
    <div class="tb-group tb-brand">
      <span class="tb-logo">🏕</span>
      <span class="tb-name">甜牛村</span>
    </div>
    <div class="tb-group tb-clock">
      <span id="ti-date" class="tb-date">—</span>
      <span id="ti-clock" class="tb-time">--:--</span>
      <span id="ti-season" class="tb-season">—</span>
      <span id="ti-weather" class="tb-weather">—</span>
      <span id="ti-torch" class="tb-torch hidden">🔥</span>
      <span id="ti-festival" class="tb-torch hidden" title="节日进行中">🎉</span>
      <span id="ti-merchant" class="tb-torch hidden" title="商人到访中">🐴</span>
    </div>
    <div class="tb-group tb-speed">
      <button id="btn-pause" class="tb-btn pause" title="暂停/继续（空格）">⏸</button>
      <button class="tb-btn spd active" data-spd="1">1×</button>
      <button class="tb-btn spd" data-spd="2">2×</button>
      <button class="tb-btn spd" data-spd="3">3×</button>
      <button class="tb-btn spd" data-spd="4">4×</button>
      <button class="tb-btn spd" data-spd="5">5×</button>
    </div>
  </nav>

  <aside id="panel-left">
    <section class="card">
      <h3 class="card-title">📊 概览</h3>
      <div class="ov-grid">
        <div class="ov-item"><span class="ov-k">人口</span><span class="ov-v" id="s-pop">—</span></div>
        <div class="ov-item"><span class="ov-k">幸福</span><span class="ov-v" id="s-happy">—</span></div>
        <div class="ov-item"><span class="ov-k">健康</span><span class="ov-v" id="s-health">—</span></div>
        <div class="ov-item"><span class="ov-k">仓储</span><span class="ov-v" id="s-storage">—</span></div>
        <div class="ov-item"><span class="ov-k">出生</span><span class="ov-v ok" id="s-births">—</span></div>
        <div class="ov-item"><span class="ov-k">逝世</span><span class="ov-v warn" id="s-deaths">—</span></div>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">📦 资源</h3>
      <div class="res-grid">
        <div class="res-item"><span class="res-k">食物</span><span class="res-v" id="s-food">—</span></div>
        <div class="res-item"><span class="res-k">熟食</span><span class="res-v" id="s-meal">—</span></div>
        <div class="res-item"><span class="res-k">谷物</span><span class="res-v" id="s-grain">—</span></div>
        <div class="res-item"><span class="res-k">淡水</span><span class="res-v" id="s-water">—</span></div>
        <div class="res-item"><span class="res-k">原木</span><span class="res-v" id="s-log">—</span></div>
        <div class="res-item"><span class="res-k">木板</span><span class="res-v" id="s-plank">—</span></div>
        <div class="res-item"><span class="res-k">石料</span><span class="res-v" id="s-stone">—</span></div>
        <div class="res-item"><span class="res-k">草药</span><span class="res-v" id="s-herb">—</span></div>
        <div class="res-item"><span class="res-k">皮毛</span><span class="res-v" id="s-hide">—</span></div>
        <div class="res-item"><span class="res-k">织物</span><span class="res-v" id="s-cloth">—</span></div>
        <div class="res-item"><span class="res-k">衣物</span><span class="res-v" id="s-clothes">—</span></div>
      </div>
      <div class="hud-label" style="margin-top:4px;">牲畜</div>
      <div class="res-grid">
        <div class="res-item"><span class="res-k">🐔鸡</span><span class="res-v" id="s-chicken">—</span></div>
        <div class="res-item"><span class="res-k">🐑羊</span><span class="res-v" id="s-sheep">—</span></div>
        <div class="res-item"><span class="res-k">🐷猪</span><span class="res-v" id="s-pig">—</span></div>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">🔬 研习</h3>
      <div class="tech-info" id="s-tech">—</div>
      <div class="tech-bar"><i id="b-tech"></i></div>
    </section>

    <section class="card card-god">
      <h3 class="card-title">⚡ 神力</h3>
      <div class="god-grid">
        <button class="god-btn" data-god="food" title="天降食物">🍞</button>
        <button class="god-btn" data-god="heal" title="神迹治愈">💚</button>
        <button class="god-btn" data-god="harvest" title="丰收祝福">🌾</button>
        <button class="god-btn" data-god="fire" title="天火">🔥</button>
        <button class="god-btn" data-god="plague" title="瘟疫">☠</button>
        <button class="god-btn" data-god="storm" title="风暴">⛈</button>
        <button class="god-btn" data-god="drought" title="干旱">☀</button>
        <button class="god-btn" data-god="wanderer" title="远方来客">🚶</button>
      </div>
    </section>

    <section class="card card-actions">
      <button class="act-btn" id="btn-newgame" title="生成随机新世界">🏛 新世界</button>
      <button class="act-btn" id="btn-save" title="保存当前进度">💾 存档</button>
      <button class="act-btn" id="btn-load" title="读取最近存档">📂 读档</button>
    </section>
  </aside>

  <aside id="panel-right">
    <section class="card card-people">
      <h3 class="card-title">👥 村民</h3>
      <input id="v-search" type="text" placeholder="搜索…" autocomplete="off">
      <div id="villager-list" class="scroll"></div>
    </section>
    <section class="card card-feed">
      <div class="feed-tabs">
        <button class="ftab active" data-tab="log">📋 纪事</button>
        <button class="ftab" data-tab="msg">💬 消息</button>
      </div>
      <div id="log-list" class="tabpane active scroll"></div>
      <div id="msg-list" class="tabpane scroll"></div>
    </section>
  </aside>

  <div id="minimap-wrap"><canvas id="minimap" width="176" height="176"></canvas></div>

  <div id="detail-card" class="card hidden">
    <h3 class="card-title" id="dc-name">—</h3>
    <div id="dc-sub" class="dc-sub">—</div>
    <div class="dc-bars">
      <div class="dc-bar"><span>饱食</span><div class="bar"><i id="b-satiety"></i></div></div>
      <div class="dc-bar"><span>饮水</span><div class="bar"><i id="b-thirst"></i></div></div>
      <div class="dc-bar"><span>精力</span><div class="bar"><i id="b-energy"></i></div></div>
      <div class="dc-bar"><span>体力</span><div class="bar"><i id="b-stamina"></i></div></div>
      <div class="dc-bar"><span>心情</span><div class="bar"><i id="b-mood"></i></div></div>
      <div class="dc-bar"><span>幸福</span><div class="bar"><i id="b-happy"></i></div></div>
      <div class="dc-bar"><span>健康</span><div class="bar"><i id="b-health"></i></div></div>
    </div>
    <div id="dc-activity" class="dc-sub">—</div>
    <div id="dc-status" class="dc-sub" style="display:none;color:#e88"></div>
  </div>

  <div id="loading">甜牛村正在孕育世界……</div>
</div>

<script src="vendor/pixi.min.js"></script>
<script>
window.onerror = function (msg, src, line, col) {
  var el = document.getElementById("loading");
  if (el) el.innerHTML = "<span style='color:#e8734a;font-size:14px'>JS错误: " + msg + "<br>" + (src||"") + ":" + line + "</span>";
  try { window.chrome.webview.postMessage(JSON.stringify({ type: "jserror", msg: msg + " @" + (src || "") + ":" + line + ":" + col })); } catch (e) { }
  return false;
};
</script>
<script src="js/pixels.js"></script>
<script src="js/assets.js"></script>
<script src="js/world.js"></script>
<script src="js/layers.js"></script>
<script src="js/lightingFilter.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
